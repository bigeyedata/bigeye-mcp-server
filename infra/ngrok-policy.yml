# ngrok traffic policy for the BYOK Bigeye MCP HTTP transport.
#
# This is the only network-level gate in front of the MCP server. The
# server itself enforces a Bearer token (the user's Bigeye API key) on
# every request, but anyone who guesses the ngrok URL can probe /health
# and the /mcp handshake without it. Restrict to the IP ranges your DRE
# Agent (or other MCP clients) actually call from.
#
on_http_request:
  - actions:
      - type: restrict-ips
        config:
          enforce: true
          ip_policies:
            - ipp_3D5i0vsFRuy9jDdyEj8KfuBsWPE

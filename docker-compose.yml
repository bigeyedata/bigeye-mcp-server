services:
  # Stdio MCP server — used by Claude Desktop or other clients that exec
  # into the container and pipe over stdin/stdout. Credentials come from
  # env vars at container start. The Dockerfile's default CMD is HTTP,
  # so this service overrides it back to stdio.
  bigeye-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: bigeye-mcp-server:latest
    container_name: bigeye-mcp-server
    command: ["python", "server.py"]
    stdin_open: true
    tty: true
    environment:
      - BIGEYE_API_KEY=${BIGEYE_API_KEY}
      - BIGEYE_BASE_URL=${BIGEYE_BASE_URL:-https://app.bigeye.com}
      - BIGEYE_WORKSPACE_ID=${BIGEYE_WORKSPACE_ID}
      - BIGEYE_DEBUG=${BIGEYE_DEBUG:-false}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ${HOME}/.bigeye-mcp:/home/mcp/.bigeye-mcp
    mem_limit: 512m
    cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Streamable HTTP MCP server — BYOK transport. No credentials baked in;
  # each MCP client request supplies its own Bigeye API key + workspace
  # via Authorization Bearer + X-Bigeye-* headers (see transport_http.py
  # and README). Pair with the `ngrok` profile to expose this over the
  # public internet for cloud agents like the Bigeye DRE Agent.
  bigeye-mcp-http:
    build:
      context: .
      dockerfile: Dockerfile
    image: bigeye-mcp-server:latest
    container_name: bigeye-mcp-server-http
    ports:
      - "9101:9101"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    mem_limit: 512m
    cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  # ngrok HTTP tunnel — only started under `--profile tunnel`. Points at
  # bigeye-mcp-http:9101 over the compose network. Requires a config
  # file at ~/Library/Application Support/ngrok/ngrok.yml with an
  # authtoken; the IP allowlist in infra/ngrok-policy.yml is the only
  # security gate in front of the MCP server's bearer auth, so keep it
  # populated with the IPs your DRE Agent runs from.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: bigeye-mcp-ngrok
    restart: unless-stopped
    profiles:
      - tunnel
    command: http --url=https://bigeye-mcp.ngrok.app --config /home/ngrok/.config/ngrok/ngrok.yml --traffic-policy-file /etc/ngrok/policy.yml bigeye-mcp-http:9101
    ports:
      - "4041:4040"
    volumes:
      - ${HOME}/Library/Application Support/ngrok/ngrok.yml:/home/ngrok/.config/ngrok/ngrok.yml:ro
      - ./infra/ngrok-policy.yml:/etc/ngrok/policy.yml:ro
    depends_on:
      - bigeye-mcp-http
    networks:
      - default

  test-client:
    image: python:3.12-slim
    container_name: bigeye-mcp-test-client
    profiles:
      - test
    depends_on:
      - bigeye-mcp
    stdin_open: true
    tty: true
    command: |
      sh -c "pip install mcp && python -c 'import sys; print(\"Test client ready. Use docker-compose run test-client to interact with the MCP server.\")' && tail -f /dev/null"

networks:
  default:
    name: bigeye-mcp-network